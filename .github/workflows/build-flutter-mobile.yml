name: Build Flutter mobile APK

# This build cannot run in the Claude Code sandbox that otherwise develops
# this repo: that environment's network policy blocks Google's Android
# SDK/Maven infrastructure, which the Android Gradle build fundamentally
# needs. GitHub's own runners have normal internet access, so the actual
# APK is built here instead — this workflow's only job is producing that
# installable file for the teacher to sideload and test.
on:
  push:
    branches: [claude/electron-desktop-app]
    paths:
      - 'flutter_mobile/**'
      - '.github/workflows/build-flutter-mobile.yml'
  workflow_dispatch: {}

# Needed to commit the built APK back to the repo (see the last step) —
# the Claude Code sandbox that develops this repo can't reach the
# upload-artifact download URL directly (it's Azure Blob Storage, not on
# that sandbox's network allowlist), but a normal `git pull` over
# github.com already works fine there, so committing the binary is the
# reliable way to actually get it out of this workflow.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: student-tracker-mobile-apk
          path: flutter_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Committed under dist-mobile/ at the repo ROOT (outside
      # flutter_mobile/, which this workflow's own path filter watches) so
      # this commit doesn't re-trigger the same workflow.
      - name: Commit built APK to the repo
        working-directory: .
        run: |
          mkdir -p dist-mobile
          cp flutter_mobile/build/app/outputs/flutter-apk/app-release.apk dist-mobile/StudentTracker-mobile.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist-mobile/StudentTracker-mobile.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update built mobile APK ($(git rev-parse --short HEAD))"
            # actions/checkout leaves the repo in detached HEAD by default,
            # so a plain `git push` (with no branch target) would fail —
            # push explicitly to the branch this workflow ran on.
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "APK unchanged, nothing to commit."
          fi
