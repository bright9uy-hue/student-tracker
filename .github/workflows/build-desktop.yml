name: Build Windows desktop installer

# electron-builder's NSIS target needs to run the freshly-built installer
# once under Wine (to extract its embedded uninstaller) when building on
# Linux - this sandbox's Wine has a broken wow64 layer (and the OS's i386
# package set can't install wine32 to fix it), so that step always fails
# here. A native windows-latest runner doesn't need Wine at all, so the
# actual installer is built here instead.
on:
  push:
    branches: [claude/electron-desktop-app]
    paths:
      - 'electron/**'
      - 'server.js'
      - 'licensing.js'
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'mobile/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch: {}

# Needed to commit the built installer back to the repo (see the last
# step) — the Claude Code sandbox that develops this repo can't reach the
# upload-artifact download URL directly, but a normal `git pull` over
# github.com already works fine there.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: student-tracker-desktop-installer
          path: dist/StudentTracker-Setup-*.exe
          retention-days: 30

      # Committed under dist-desktop/ (a differently-named folder than the
      # gitignored dist/ electron-builder writes to, and outside the paths
      # this workflow's own trigger watches) so this commit doesn't
      # re-trigger the same workflow.
      - name: Commit built installer to the repo
        shell: bash
        run: |
          mkdir -p dist-desktop
          cp dist/StudentTracker-Setup-*.exe dist-desktop/StudentTracker-Setup.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist-desktop/StudentTracker-Setup.exe
          if ! git diff --cached --quiet; then
            git commit -m "chore: update built desktop installer ($(git rev-parse --short HEAD))"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Installer unchanged, nothing to commit."
          fi
