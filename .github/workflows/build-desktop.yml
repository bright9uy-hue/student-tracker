name: Build Windows desktop installer

# electron-builder's NSIS target needs to run the freshly-built installer
# once under Wine (to extract its embedded uninstaller) when building on
# Linux - this sandbox's Wine has a broken wow64 layer (and the OS's i386
# package set can't install wine32 to fix it), so that step always fails
# here. A native windows-latest runner doesn't need Wine at all, so the
# actual installer is built here instead.
on:
  push:
    branches: [claude/electron-desktop-app]
    paths:
      - 'electron/**'
      - 'server.js'
      - 'licensing.js'
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'mobile/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch: {}

# The installer (~136 MB: Electron + bundled node.exe + the Puppeteer
# Chromium whatsapp-web.js needs) is well over GitHub's 100 MB hard limit
# for a regular git push, so — unlike the mobile APK — it can't be
# committed back to the repo. It's fetched instead as this workflow's own
# upload-artifact output (GitHub Actions artifacts allow much larger
# files), which the Claude Code sandbox reads via the GitHub API's
# "download workflow run artifact" call.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: student-tracker-desktop-installer
          path: dist/StudentTracker-Setup-*.exe
          retention-days: 30
